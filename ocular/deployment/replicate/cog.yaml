# Replicate Cog Configuration for OLMocr
# This file configures the Replicate deployment environment

build:
  # Enable GPU support
  gpu: true

  # CUDA version for GPU acceleration
  cuda: "12.1"

  # Python version
  python_version: "3.11"

  # System packages
  system_packages:
    - "libgl1-mesa-glx"
    - "libglib2.0-0"
    - "libsm6"
    - "libxext6"
    - "libxrender-dev"
    - "libgomp1"
    - "libgcc-s1"
    - "git"
    - "curl"
    - "wget"

  # Python packages
  python_packages:
    - "vllm==0.4.0"
    - "torch==2.1.0"
    - "torchvision==0.16.0"
    - "transformers==4.35.0"
    - "tokenizers==0.15.0"
    - "accelerate==0.25.0"
    - "huggingface-hub==0.19.0"
    - "Pillow==10.0.0"
    - "numpy==1.24.0"
    - "scipy==1.11.0"
    - "requests==2.31.0"
    - "fastapi==0.104.0"
    - "pydantic==2.5.0"
    - "safetensors==0.4.0"

# Prediction configuration
predict: "predict.py:Predictor"

# Image configuration
image: "r8.im/allenai/olmocr-vllm"
# Babel configuration for extracting translatable strings
# This file defines which files to scan and how to extract strings

[python: ocular/**.py]
# Extract strings from Python files using gettext syntax
# Looks for: _("text"), gettext("text"), ngettext(), etc.

[jinja2: ocular/templates/**.html]
# Extract strings from Jinja2 templates
# Looks for: {{ _("text") }}, {% trans %}text{% endtrans %}, etc.
encoding = utf-8
extensions = jinja2.ext.i18n

[jinja2: ocular/routers/templates/**.html]
# Extract from router-specific templates if any
encoding = utf-8
